{# templates/login.html #}
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 30px;">Login to Task Manager</h2>
        
        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required placeholder="admin@example.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color: #667eea;">Sign up</a>
        </p>
        
        <div style="margin-top: 20px; padding: 15px; background: #f0fdf4; border-radius: 8px;">
            <p style="font-size: 12px; color: #666; margin: 0;">
                <strong>Demo Admin:</strong> admin@example.com / admin123
            </p>
        </div>
    </div>
</div>
{% endblock %}
